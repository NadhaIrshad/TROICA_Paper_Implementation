# =============================================================================
# default.yaml - the paper's values. NEVER edit this file.
#
# configs/my_experiment.yaml is merged on top of it. Ablation files under
# configs/ablations/ change one line each.
#
# Tags:  [PAPER]        = stated explicitly in Zhang, Pi & Liu (IEEE TBME 2015)
#        [ASSUMPTION Ax] = the paper is silent; Blueprint Section 11 register
#        [DEVIATION]    = not in either spec; reason given inline
#
# Layout is the slot layout of Exploration Lab Spec Section 3: each swappable
# stage has `method` (which plug-in) and `params` (its settings).
# =============================================================================

# [DEVIATION] Neither spec gives data or results paths; both are needed to run
# anything. Recorded in DEVIATIONS.md. `dir` is relative to the repository root.
data:
  dir: datasets/IEEE_SPC_2015   # loader appends Training_data / TestData
  split: training               # training (12 subjects, has ECG) | test (8 subjects, no ECG)

results:
  dir: results                  # per-run folder results/<run.name>_<timestamp>/

run:
  name: default
  subjects: all                 # all | [1, 5, 6]
  n_jobs: 4                     # parallel across subjects only; windows stay sequential
  allow_ground_truth_access: false
  trace:
    level: none                 # none | light

signal:
  fs: 125                       # [PAPER] Hz
  window_s: 8                   # [PAPER] T
  step_s: 2                     # [PAPER] S
  ppg_channel: 0                # [ASSUMPTION A15] 0 = PPG channel 1, 1 = channel 2

grid:
  n_fft: 4096                   # [PAPER] N, shared FFT / SSR frequency grid

bandpass:
  method: butter                # [ASSUMPTION A1] butter | fir
  params:
    low_hz: 0.4                 # [PAPER]
    high_hz: 5.0                # [PAPER]
    order: 4                    # [ASSUMPTION A1]
    mode: per_window            # [ASSUMPTION A2] per_window | global

acc_dominant:                   # helper feeding WindowContext, not a slot
  rel_threshold: 0.5            # [PAPER] keep acc peaks > 50 % of that axis's max
  exclude_delta_bins: 10        # [PAPER] Delta, about 0.3 Hz at N=4096, fs=125
  n_harmonics: 2                # [ASSUMPTION A6] 1 = fundamental only, 2 = + 1st harmonic
  restrict_to_band: true        # [ASSUMPTION A19] limit the peak search to 0.4-5 Hz

decomposition:
  method: ssa                   # ssa | none  (none = ablation "without SSA")
  params:
    L: 400                      # [PAPER]
    grouping: frequency_pairing # [ASSUMPTION A4] frequency_pairing | wcorr_hclust | singleton
    sv_rel_tol: 0.1             # [ASSUMPTION A4]
    freq_tol_bins: 2            # [ASSUMPTION A4]
    match_tol_bins: 2           # [ASSUMPTION A5]
    n_groups_max: 0             # [ASSUMPTION A4] wcorr_hclust cluster count; 0 = auto

temporal_diff:
  method: diff                  # diff | none
  params:
    order: 2                    # [PAPER] second-order difference
    normalize_after: true       # [ASSUMPTION A3] z-score before the spectrum estimator

spectrum_estimator:
  method: focuss                # focuss | fft  (fft = ablation "FFT instead of SSR")
  params:
    p: 0.8                      # [PAPER]
    lam: 0.1                    # [PAPER]
    n_iter: 5                   # [PAPER] no need to iterate to convergence
    x0: ones                    # [ASSUMPTION A11] ones | matched_filter
    prune_columns: true         # [PAPER] Eq. 12

tracker:
  method: troika
  params:
    init_mode: max_peak         # max_peak | ground_truth (debug; marks run CONTAMINATED)
    init_band_bpm: [40, 200]    # [ASSUMPTION A10]
    delta_s: 16                 # [PAPER]
    delta_s_wide: 20            # [PAPER]
    max_peaks_per_range: 3      # [PAPER]
    eta_frac: 0.30              # [PAPER] 30 % of the highest peak in R0
    harm_tol_bins: 2            # [ASSUMPTION A7]
    pair_tiebreak: max_power    # [ASSUMPTION A8] max_power | closest_to_prev
    half_rounding: round        # [ASSUMPTION A17] round | floor
    verification:
      enabled: true             # false = ablation "without verification"
      theta_bins: 6             # [PAPER]
      tau_bins: 2               # [PAPER]
      stall_windows_h: 3        # [PAPER]
      trend_history_windows: 20 # [PAPER]
      trend_poly_order: 3       # [PAPER]
      trend_threshold_bpm: 3    # [PAPER]

evaluation:
  std_ddof: 1                   # sample std, matches the paper's 2.34 +/- 0.82
  compare_with_paper: true      # add paper columns and deltas to the stats table
  within_bpm: 5                 # for the "% of windows within X BPM" column
