[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "troika-hr"
version = "0.1.0"
description = "From-scratch implementation of TROIKA heart-rate estimation from wrist PPG (Zhang, Pi & Liu, IEEE TBME 2015)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
lab = [
    "plotly>=5.18",
    "nbformat>=5.9",
    "ipykernel>=6.25",
    "ipywidgets>=8.1",
    "jupytext>=1.16",
    "tqdm>=4.66",
    "joblib>=1.3",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "pytest>=7.4",
]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]
png = ["kaleido>=0.2.1"]
ml = ["xgboost>=2.0"]
dl = ["torch>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning"]
